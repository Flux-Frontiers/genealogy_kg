# pyproject.toml -- GenealogyKG package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Extras are user-facing features; dev tooling is a Poetry group, so it never
# ships in the wheel and cannot be pip-installed. See FLEET_STANDARDS.md in
# kgrag_priv.
#
# Quick install (pip)
# -------------------
#   pip install -e "."                  core runtime only
#   pip install -e ".[adapter]"         + kg-rag (for genealogy_kg.adapter)
#   pip install -e ".[viz]"             + plotly/pyvis/streamlit (genkg viz)
#   pip install -e ".[viz3d]"           + 3-D visualiser and light-field quilts
#
# Quick install (poetry)
# ----------------------
#   poetry install                      core runtime only
#   poetry install --with dev           + pytest, ruff, ty, pre-commit
#   poetry install --with kg            + the dockg/pycodekg CLIs (maintainer tooling)
#   poetry install --all-extras --with dev,kg   full maintainer environment
#
# Run tests
# ---------
#   pytest                          uses pytest.ini (testpaths = tests/)
#
# Build the genealogy graph
# -------------------------
#   genkg build --source family.ged

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "genealogy_kg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "genealogy-kg"
version = "0.1.0"
description = "KGModule for genealogical knowledge graphs built from GEDCOM files"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "genealogy", "gedcom", "family-tree", "sqlite-vec", "semantic-search", "kgmodule"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Sociology :: Genealogy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    # GEDCOM 5.5 / 5.5.1 reader. MIT-licensed, which matters: the other
    # maintained parser on PyPI (python-gedcom) is GPLv2 and cannot sit under
    # an Elastic-2.0 package. Handles ANSEL/UTF-8 codecs, CONT/CONC
    # continuation and the full DATE grammar (ABT, BEF, AFT, BET ... AND,
    # FROM ... TO), none of which is worth reimplementing.
    "ged4py>=0.5.2",
    # kg_utils.temporal -- the fleet's shared time contract that
    # birth/death/marriage dates are derived into -- landed in 0.18.0. The
    # floor sits at 0.18.1 so that every kgmodule-utils declaration in this
    # file carries the same number, per kgrag_priv/docs/FLEET_STANDARDS.md
    # ("one package, one floor per repo"): a reader should not have to guess
    # which of several numbers is the real requirement.
    "kgmodule-utils[semantic,sqlite-vec]>=0.18.1",
    # Capped: mcp 2.0 split FastMCP into its own package, and mcp_server.py
    # imports it from `mcp` at module scope. Lift only alongside that port.
    "mcp>=1.0.0,<2",
]

[project.optional-dependencies]
# src/genealogy_kg/adapter.py imports kg_rag at module scope. It is not
# exported from __init__.py, so the dependency is optional rather than core;
# the fleet convention is that kg-rag ships its own lazy adapter as well.
# 0.15.0 is a hard floor, not a preference: it is where `KGKind.GENEALOGY`
# lands.
adapter = [
    "kg-rag>=0.15.0",
]
# 2-D family-tree rendering: src/genealogy_kg/viz.py (pyvis network, plotly
# pedigree chart) and the Streamlit branch of adapter.display(). Imported only
# inside cli/cmd_viz.py and those entry points, so a bare install never pulls
# any of it.
#
# pyvis is NOT hand-listed. The renderer is kg_utils.viz.build_graph_html, so
# the SDK owns that dependency and this extra asks for it by name -- what
# FLEET_STANDARDS.md requires, and what diary_kg's dead viz3d extra got wrong
# by hand-listing the render stack and never depending on the SDK extra where
# the code actually lives.
viz = [
    "kgmodule-utils[viz]>=0.18.1",
    "plotly>=5.14.0",
    "streamlit>=1.35.0",
]
# 3-D family-tree visualiser and light-field quilts (genkg viz3d / genkg
# quilt), following gutenberg_kg's and pycode_kg's layering: the growth
# engine and layouts (kg_utils.viz3d) live in kgmodule-utils, the swept-tube
# / point-cloud composition and quilt output in quiltwright, and only the
# domain glue -- which node becomes trunk, limb, or leaf -- here. Pulled via
# kgmodule-utils[viz3d-render,viz3d-qt] rather than hand-listing pyvista /
# PyQt5 / trame, per kgrag_priv/docs/FLEET_STANDARDS.md (diary_kg's viz3d
# extra went dead the other way).
viz3d = [
    "markdown>=3.6",
    "param>=2.0.0",
    "PyQt5>=5.15.0",
    "pyvistaqt>=0.11.0",
    "kgmodule-utils[viz3d-render,viz3d-qt]>=0.18.1",
    "quiltwright>=0.10.0",
]

# ---------------------------------------------------------------------------
# Dev tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# `optional = true` keeps it out of a bare `poetry install`.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
ty = ">=0.0.44"
pre-commit = ">=4.5.1"
# >=9.0.3 is a security floor, not a preference: GHSA-6w46-j5rx-g56g.
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
# Capped below 0.16 to match the rest of the fleet and the rev pinned in
# .pre-commit-config.yaml.
ruff = ">=0.4.0,<0.16"

# ---------------------------------------------------------------------------
# Maintainer tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# doc-kg and pycode-kg are tools this repo *runs*, not libraries it imports.
# Nothing under src/ imports either one. .mcp.json serves both as MCP servers
# and `make build-kg` invokes their CLIs.
#
#   poetry install --with kg      # get the dockg / pycodekg CLIs into .venv/bin
[tool.poetry.group.kg]
optional = true

[tool.poetry.group.kg.dependencies]
doc-kg = ">=0.22.0"
pycode-kg = ">=0.24.1"

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/genealogy_kg"
Repository = "https://github.com/Flux-Frontiers/genealogy_kg"

[project.scripts]
genkg     = "genealogy_kg.cli:cli"
genkg-mcp = "genealogy_kg.mcp_server:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# ruff 0.16 formats Python code blocks embedded in Markdown; keep prose docs
# out of its reach, as doc_kg and ftree_kg do.
exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests that exercise real external dependencies (model, sqlite-vec)",
]

[tool.coverage.run]
# Pure entry-point boilerplate (no branching logic of their own) and the Qt
# viewer, which needs a live QApplication event loop -- exercising it is a
# manual/GUI concern, not something worth a headless-Qt CI setup for. Every
# other module is real logic and stays counted.
omit = [
    "src/genealogy_kg/cli/__main__.py",
    "src/genealogy_kg/cli/main.py",
    "src/genealogy_kg/viz3d.py",
]

[tool.coverage.report]
# A floor against regression, not a target -- see docs/CODEBASE_REVIEW.md
# item 6. Re-raise it as real coverage grows; CI's test job doesn't install
# the viz3d extra, so this is checked against that leaner profile.
fail_under = 80

[tool.genealogykg]
# GEDCOM files to index, relative to the repo root. `genkg build
# --source` overrides this and records its choice in .genealogykg/config.json.
sources = []

[tool.pycodekg]
# Tests skew architectural metrics (fan-in, public API surface, docstring coverage).
exclude = ["tests"]
include = ["src"]

[tool.dockg]
exclude = ["__pycache__", "dist", "src", "tests"]
