name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: lint-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dev dependencies
        run: poetry install --no-interaction --with dev

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Lint
        run: poetry run ruff check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: typecheck-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # All three extras. ty never executes anything (no Qt event loop, no GL
      # context), it only needs the packages importable on disk to resolve
      # their type stubs. Skipping viz3d here would make
      # `plotter.reset_camera()` in cmd_viz.py type-check as Any (unresolved
      # import) instead of catching the real pyvista/functools stub mismatch
      # its `ty: ignore[missing-argument]` comment documents -- and it would
      # flag that comment as unused, the opposite problem. The test job
      # installs the same three, but needs xvfb on top to run them.
      - name: Install dependencies
        run: poetry install --no-interaction --with dev -E viz -E adapter -E viz3d

      - name: Run ty
        run: poetry run ty check src/

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: test-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # The runner has no GPU and no X display, so pyvista's off-screen
      # rendering needs a software GL stack and a virtual framebuffer to
      # render into. Copied from quiltwright's .github/workflows/tests.yml,
      # which solved the same problem for the same PyVista/Qt surface (minus
      # povray, which this repo does not need).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libxrender1

      # All three extras, matching the type-check job. viz (plotly/streamlit/
      # pyvis) and adapter (kg-rag) so test_viz.py and the kg_rag-gated
      # registry tests actually run instead of erroring on collection or
      # silently skipping -- local `pre-commit`/pytest use a maintainer venv
      # with these installed, so CI needs the same surface or a green
      # pre-commit run stops predicting a green CI run.
      #
      # viz3d (PyQt5, pyvistaqt) is installed for the same reason: the six
      # tests in test_scene.py that build a real scene degrade via
      # `pytest.importorskip("pyvista")`, so leaving the extra out did not
      # fail CI, it silently skipped every one of them on every run. With the
      # xvfb step above they execute.
      - name: Install dependencies
        run: poetry install --no-interaction --with dev -E viz -E adapter -E viz3d

      # --cov activates the fail_under gate in [tool.coverage.report]
      # (pyproject.toml) -- coverage.py reads it automatically. --cov-fail-under
      # is not repeated here on purpose: one number to keep in sync, not two.
      #
      # xvfb-run wraps the whole invocation rather than just the 3-D cases:
      # pytest picks its DISPLAY up from the environment, and there is no
      # per-test hook to scope it more narrowly.
      - name: Run tests
        run: xvfb-run -a poetry run pytest -m "not integration" --cov=genealogy_kg --cov-report=term-missing

  wheel:
    name: Installed CLI
    runs-on: ubuntu-latest
    # Guards the one thing the other jobs structurally cannot see. lint,
    # type-check and test all run against the source tree with
    # pythonpath = ["src"], so they pass even when the built wheel is missing
    # modules the CLI imports, or when a dependency is declared in a form PyPI
    # strips from wheel metadata. ia-kg 0.1.0 shipped exactly that way: green
    # CI, and every console script dead on `pip install`.
    #
    # This builds the artifact users actually receive, installs it somewhere
    # with no source tree in sight, and loads every console-script entry point.
    # entry_point.load() imports the module and resolves the attribute without
    # calling it -- so an MCP server entry point is verified, not started.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Build wheel
        run: poetry build

      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl

      - name: Load every console-script entry point
        run: |
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          import importlib.metadata as md
          import sys

          eps = [e for e in md.distribution("genealogy-kg").entry_points
                 if e.group == "console_scripts"]
          if not eps:
              sys.exit("no console scripts found in the installed distribution")

          failed = []
          for e in sorted(eps, key=lambda e: e.name):
              try:
                  e.load()
                  print(f"  ok    {e.name} -> {e.value}")
              except Exception as exc:
                  failed.append(e.name)
                  print(f"  FAIL  {e.name} -> {e.value}\n        {type(exc).__name__}: {exc}")
          if failed:
              sys.exit(f"\n{len(failed)} console script(s) unusable when installed: "
                       + ", ".join(failed))
          print(f"\nall {len(eps)} console scripts load from a clean install")
          PY
